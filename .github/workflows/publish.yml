name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# npm Trusted Publishing: the registry trusts this repository and this workflow
# file directly, so there is no NPM_TOKEN to store, leak or rotate — and no
# interactive 2FA prompt, which is what made publishing 0.1.0 a manual dance.
#
# One-time setup on npmjs.com, otherwise every run fails at the publish step:
#   npmjs.com/package/mcp-freestyle → Settings → Trusted Publisher
#   → GitHub Actions, repository `lozit/mcp-freestyle`, workflow `publish.yml`
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - run: npm ci

      # A tag that disagrees with package.json publishes the wrong version under
      # the right name, which is not something a later commit can undo. The
      # registry entry points at an npm version too, so server.json is checked
      # in the same breath.
      - name: Tag, package.json and server.json agree
        run: node scripts/check-versions.mjs

      # The same gates as CI. `prepublishOnly` would run them anyway, but failing
      # here names the step that broke instead of burying it in publish output.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # README, CHANGELOG and LICENSE ship inside the tarball and npm only
      # refreshes them on a new version — 0.1.0 went out advertising itself as
      # unpublished (docs/LEARNINGS.md).
      - name: README does not still say "not published"
        run: |
          if grep -qi "not published yet" README.md; then
            echo "::error::README still says the package is unpublished"
            exit 1
          fi

      - name: The built server starts
        run: node scripts/check-starts.mjs

      - run: npm publish --provenance --access public

      # Listing on the MCP Registry is what makes the server discoverable from
      # clients. It runs after npm on purpose: the registry entry points at an
      # npm version, so publishing it first would advertise a package that does
      # not exist yet.
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # Namespace ownership is proven by the OIDC token, not by a secret: only a
      # workflow in github.com/lozit/* can claim io.github.lozit/*.
      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Validate server.json against the published schema
        run: ./mcp-publisher validate

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
